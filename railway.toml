[build]
dockerfilePath = "Dockerfile"
# Lite image: remote inference only, ~475 MB, no local models.
# Change to "runtime" for the full image with on-device AI.
dockerTarget = "runtime-lite"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 5
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
