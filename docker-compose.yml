# Kothai — one container. AI is optional and goes to any OpenAI-compatible endpoint.
#   docker compose up -d     then open http://localhost:5173
# Want models on this machine? Add Ollama alongside it:
#   docker compose --profile ollama up -d
# then pick Ollama during setup. The tile finds it at http://ollama:11434/v1,
# or at an Ollama on the host if the profile is not running.
# Full guide: docs/self-hosting.md
services:
  kothai:
    image: ghcr.io/ibrahimtareq/kothai:latest
    # Prefer building from this checkout instead of pulling the published image?
    # Uncomment the line below and run `docker compose up -d --build`.
    # build: .
    container_name: kothai
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Your notes, uploads and settings. THIS is the directory to back up.
      - ./data:/app/data
    # The host, from inside the container. Docker Desktop resolves this name by
    # itself; Linux only with this line, and without it the Ollama tile cannot
    # reach an Ollama installed on the machine.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Reads .env if present; safe to run without one too — the values below are
    # the built-in defaults.
    env_file:
      - path: .env
        required: false
    # environment:
    #   PORT: "5173"
    #   # Require a password before anything is served. Unset = no auth, which
    #   # is the default and fine on a LAN or tailnet. Set it before putting
    #   # Kothai on a public hostname.
    #   KOTHAI_PASSWORD: "choose-something-long"
    #   # KOTHAI_HOME sets one root that the paths below derive from —
    #   # use it on hosts that allow only a single volume.
    #   KOTHAI_HOME: /app
    #   KOTHAI_DATA_DIR: /app/data
    #   # Point every AI role at one endpoint. Embedding needs a host that serves
    #   # an embeddings route: Ollama, llama.cpp server, vLLM, OpenAI and
    #   # OpenRouter do; Groq and Anthropic do not. Vision and embedding can take
    #   # their own KOTHAI_AI_VISION_* / KOTHAI_AI_EMBED_* URL and key instead.
    #   KOTHAI_AI_BASE_URL: http://ollama:11434/v1
    #   # Credentials are env-only here: never written to the database and never
    #   # returned by the API, so they cannot leak via a backup or an export.
    #   # Not needed for Ollama or llama.cpp.
    #   KOTHAI_AI_API_KEY: "your-key"
    #   # Model NAMES are picked in Settings, or pinned with KOTHAI_AI_LLM_MODEL,
    #   # KOTHAI_AI_VISION_MODEL and KOTHAI_AI_EMBED_MODEL.

  # Models on this machine. Off unless you pass `--profile ollama`.
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    container_name: kothai-ollama
    restart: unless-stopped
    volumes:
      # Downloaded weights. Re-pullable, so no need to back this up.
      - ollama:/root/.ollama
    # No `ports:` — Kothai reaches it by service name. Pull models with
    #   docker compose exec ollama ollama pull <model>
    # For an NVIDIA GPU, add a `deploy.resources.reservations.devices` entry
    # (see Ollama's Docker docs); it runs on CPU as-is.

volumes:
  ollama:

# The healthcheck is baked into the image and reports liveness only: the
# container is "healthy" whether or not an AI endpoint is configured or up.
