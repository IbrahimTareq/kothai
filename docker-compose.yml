# Kothai — one container, everything on-device.
#   docker compose up -d     then open http://localhost:5173
# Full guide: docs/self-hosting.md
services:
  kothai:
    image: ghcr.io/ibrahimtareq/kothai:latest
    # Prefer building from this checkout instead of pulling the published image?
    # Uncomment the line below and run `docker compose up -d --build`.
    # build: .
    container_name: kothai
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # Your notes, uploads and settings. THIS is the directory to back up.
      - ./data:/app/data
      # Model weights, 1.3-3.4 GB. Re-downloadable — no need to back up.
      - ./models:/app/models
    # Reads .env if present; safe to run without one too — the values below are
    # the built-in defaults.
    env_file:
      - path: .env
        required: false
    # environment:
    #   PORT: "5173"
    #   # Require a password before anything is served. Unset = no auth, which
    #   # is the default and fine on a LAN or tailnet. Set it before putting
    #   # Kothai on a public hostname.
    #   STASH_PASSWORD: "choose-something-long"
    #   # STASH_HOME sets one root that the three paths below derive from —
    #   # use it on hosts that allow only a single volume.
    #   STASH_HOME: /app
    #   STASH_DATA_DIR: /app/data
    #   STASH_MODELS_DIR: /app/models
    #   STASH_CONFIG_PATH: /app/qvac.config.json
    #   # Bring your own AI: the language and vision roles go to an
    #   # OpenAI-compatible endpoint, embedding stays on this machine. That
    #   # split is the point — Ollama Cloud, Groq, Anthropic and OpenRouter
    #   # serve no embeddings route, and semantic search needs one. Keeps the
    #   # models volume, but only for the ~300 MB embedding model.
    #   STASH_AI_PROVIDER: remote
    #   STASH_AI_BASE_URL: https://ollama.com/v1
    #   # Credentials are env-only: never written to the database and never
    #   # returned by the API, so they cannot leak via a backup or an export.
    #   STASH_AI_API_KEY: "your-key"
    #   # Send embedding out as well, for an endpoint that does serve it.
    #   # Changing this later re-indexes the whole library.
    #   STASH_AI_EMBED_PROVIDER: remote

  # Lite: ~475 MB on disk, no model weights, no models volume. Every role goes to the
  # endpoint, embedding included — so it needs one that serves embeddings
  # (Ollama, llama.cpp server, vLLM, OpenAI), not a chat-only host. For those,
  # use the service above in remote mode instead.
  # Comment out the `kothai` service above and uncomment this one to use it.
  # kothai-lite:
  #   image: ghcr.io/ibrahimtareq/kothai:lite
  #   container_name: kothai
  #   restart: unless-stopped
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./data:/app/data
  #   environment:
  #     STASH_AI_PROVIDER: remote
  #     STASH_AI_BASE_URL: http://ollama:11434/v1
  #     # STASH_AI_API_KEY: sk-...   # not needed for Ollama or llama.cpp
  #   # Model NAMES are picked in Settings, not here.

# The healthcheck is baked into the image and reports liveness, so the container
# is "healthy" while models are still downloading in the background.
#
# No memory limit is set on purpose: a cap low enough to be meaningful would
# OOM the model loader. Budget 8 GB of RAM — 4 GB works if you skip images.
