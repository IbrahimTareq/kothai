# Kothai over Tailscale — remote access from your own devices, nothing public.
#
#   echo 'TS_AUTHKEY=tskey-auth-...' > .env
#   docker compose -f docker-compose.tailscale.yml up -d
#
# Then open https://kothai.<your-tailnet>.ts.net from any device signed into
# your tailnet. Same URL at home and away; on the same LAN Tailscale routes the
# connection directly rather than out to the internet and back.
#
# Nothing here is reachable from the public internet, and neither service
# publishes a port, so the app is not on your LAN either — only tailnet peers
# can see it. Enable HTTPS certificates for your tailnet first (admin console →
# DNS → HTTPS Certificates) or the certificate request fails at startup.
#
# To make it genuinely public instead, see the AllowFunnel note in
# ts-config/serve.json — and read docs/security.md before you do.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: kothai-ts
    # Becomes both the MagicDNS name and the certificate hostname:
    # kothai.<your-tailnet>.ts.net
    hostname: kothai
    environment:
      # Generate under Settings → Keys in the Tailscale admin console. Kept in
      # .env rather than inline because it can enrol nodes onto your tailnet.
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      # Without this the app is still reachable on the tailnet, but over plain
      # HTTP — and auth.js only sets the session cookie's Secure flag when
      # x-forwarded-proto says https, which Serve is what provides.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      # Node identity and keys. Losing it re-enrols the node under a new name;
      # leaking it is as bad as leaking the auth key. Gitignored.
      - ./tailscale:/var/lib/tailscale
      - ./ts-config:/config
    # Kernel networking. If your host has no /dev/net/tun — some Docker
    # Desktop and rootless setups — delete these two keys and set
    # TS_USERSPACE: "true" above instead. Serve works either way; userspace
    # mode is just slower on high throughput, which this app never reaches.
    devices:
      - /dev/net/tun
    cap_add: [NET_ADMIN, SYS_MODULE]
    restart: unless-stopped

  kothai:
    image: ghcr.io/ibrahimtareq/kothai:latest
    container_name: kothai
    # Shares the sidecar's network namespace, so Kothai has no network identity
    # of its own. That is why there is no `ports:` block, why serve.json can
    # proxy to plain 127.0.0.1, and why the image's baked-in healthcheck still
    # passes — all three are the same loopback.
    network_mode: service:tailscale
    volumes:
      # Your notes, uploads and settings. THIS is the directory to back up.
      - ./data:/app/data
      # Model weights, 1.3-3.4 GB. Re-downloadable — no need to back up.
      - ./models:/app/models
    environment:
      # Optional on a tailnet and worth setting anyway: it means one borrowed or
      # compromised peer does not hand over the whole archive. Unset or empty
      # leaves the gate off. Rotating it invalidates every session everywhere,
      # including your own, because the signing key is derived from it.
      STASH_PASSWORD: ${STASH_PASSWORD:-}
    restart: unless-stopped
    depends_on: [tailscale]
