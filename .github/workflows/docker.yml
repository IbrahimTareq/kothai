name: Build & publish Docker image

# Builds the multi-arch (linux/amd64 + linux/arm64) image and publishes it to
# GHCR (GitHub Container Registry) — no Docker Hub account or secrets needed,
# it authenticates with the built-in GITHUB_TOKEN. Unit tests and typecheck
# run first (via ci.yml) and gate the publish.
#
# One image serves every install. `:lite` is kept as an alias so containers
# pulled before v2 under that tag keep receiving updates.
#
# The amd64 image is boot-tested on the native x86 runner first. The smoke test
# asserts the server runs unprivileged and the healthcheck goes green.
#
# Trigger: push a version tag (e.g. `git tag v1.0.2 && git push --tags`),
# or run manually from the Actions tab with an explicit version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (no leading v), e.g. 1.0.1'
        required: true

# Re-tagging or re-dispatching supersedes any run still in flight for the same
# ref, so a stuck attempt never keeps a slot warm alongside its replacement.
# Grouping on the ref means two DIFFERENT tags never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/ibrahimtareq/kothai

jobs:
  # A release must not publish code whose tests fail.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest        # native amd64
    # Two multi-arch builds plus a boot test. GitHub's default is 6 HOURS; a
    # hung QEMU build or a wedged container would otherwise sit there all day
    # before anyone noticed it was stuck rather than slow.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write             # push to GHCR with GITHUB_TOKEN, no new secret
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"   # strip the leading v from the tag
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # .nvmrc is the single source of truth for Node; the Dockerfile takes
          # it as a build arg so the image cannot drift from CI and local dev.
          echo "node=$(tr -d ' \n' < .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "Building $GHCR_IMAGE:$V on Node $(tr -d ' \n' < .nvmrc)"

      - uses: docker/setup-qemu-action@v3      # arm64 emulation for the cross build
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Stage 1: build amd64 locally and boot-test it ─────────────────────
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          build-args: NODE_VERSION=${{ steps.ver.outputs.node }}
          tags: ${{ env.GHCR_IMAGE }}:smoketest-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test amd64 (boots, serves /api/health, runs unprivileged)
        # The poll loop below self-limits to 30 x 2s, but that only bounds the
        # loop — a hang in `docker run` or a wedged curl is outside it. This is
        # the hard stop for the whole step.
        timeout-minutes: 5
        run: |
          docker run -d --name kothai -p 5173:5173 -e PORT=5173 "$GHCR_IMAGE:smoketest-amd64"
          # /api/health, not /api/status: no AI endpoint is configured here, and
          # health is the one route that answers regardless.
          up=0
          for _ in $(seq 1 30); do
            if ! docker ps --filter name=kothai --format '{{.Status}}' | grep -q Up; then
              echo "::error::container exited unexpectedly"; docker logs kothai; exit 1
            fi
            if curl -sf http://localhost:5173/api/health >/dev/null; then up=1; break; fi
            sleep 2
          done
          if [ "$up" != 1 ]; then
            echo "::error::/api/health never answered"; docker logs kothai | tail -40; docker rm -f kothai; exit 1
          fi
          echo "✅ /api/health answers"
          # Read PID 1's real uid, NOT `docker exec id -u` — exec starts a
          # new process as the image's configured user (root here), so it
          # reports 0 no matter what the server dropped to.
          uid=$(docker exec kothai sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")
          if [ "$uid" = "0" ]; then
            echo "::error::server is running as root (uid 0)"; docker rm -f kothai; exit 1
          fi
          echo "✅ server runs unprivileged (uid $uid)"
          # The baked-in HEALTHCHECK needs its start period to elapse before it
          # reports anything but "starting", so poll rather than read once.
          health=starting
          for _ in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' kothai)
            [ "$health" = "healthy" ] && break
            sleep 2
          done
          if [ "$health" != "healthy" ]; then
            echo "::error::healthcheck reports '$health', expected 'healthy'"
            docker logs kothai | tail -40; docker rm -f kothai; exit 1
          fi
          echo "✅ healthcheck reports healthy"
          docker rm -f kothai

      # ── Stage 2: build both arches and push as one manifest ───────────────
      # `:lite` is the pre-v2 name of the slim image. It is now the same image,
      # tagged so existing `:lite` installs keep updating.
      - name: Build & push multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: NODE_VERSION=${{ steps.ver.outputs.node }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:lite
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published \`$GHCR_IMAGE:${{ steps.ver.outputs.version }}\` (amd64 + arm64) :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Also tagged \`latest\` and \`lite\`. amd64 smoke test passed (boots, healthy, unprivileged)." >> "$GITHUB_STEP_SUMMARY"
