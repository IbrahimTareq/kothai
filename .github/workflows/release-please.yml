name: Release Please

# Owns versioning from here on. It keeps a release PR open against main;
# merging that PR bumps package.json, writes CHANGELOG.md, pushes the vX.Y.Z
# tag and cuts the GitHub Release. docker.yml still triggers on that tag push
# and needs no change — provided the token below is a PAT. See the guard step.
#
# The release branch lives only on the remote and is never checked out here,
# so it does not collide with CLAUDE.md's no-feature-branches rule, which
# exists to stop parallel sessions stealing each other's commits.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub refuses to trigger a workflow from a tag pushed with the
      # built-in GITHUB_TOKEN. Under that token release-please would push
      # v1.4.0 and docker.yml would never fire — every release would tag
      # cleanly and publish no image, with nothing in any log saying so.
      # Fail here instead, loudly, on the day the PAT expires.
      - name: Check release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is unset — a release would tag without ever building an image."
            exit 1
          fi

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
