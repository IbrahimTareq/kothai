name: Docs site

# The site is its own package under site/, with its own lockfile, so none of
# this touches ci.yml or the image build. Path-filtered because a change to
# server code has nothing to publish.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'public/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight — a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the page footers date themselves from `git log` on the
      # file in docs/, which a shallow clone would not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: site

      # Fails on a dead internal link, which is the whole reason this also runs
      # on pull requests: a renamed doc gets caught before it reaches main.
      - name: Build
        run: pnpm run build
        working-directory: site

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
