name: Docs site

# The site is its own package under site/, with its own lockfile, so none of
# this touches ci.yml or the image build. Path-filtered because a change to
# server code has nothing to publish. public/** is in the filter because the
# site mirrors the app's logo and font faces out of it at build time.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'public/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight — a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Access environment secrets (Umami analytics config)
    environment: github-pages
    steps:
      # Full history: each page dates itself from `git log` on its file in
      # docs/, read by site/lib/sync.ts, which a shallow clone would not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: site

      # Fails on a dead internal link, which is the whole reason this also runs
      # on pull requests: a renamed doc gets caught before it reaches main.
      - name: Build
        run: pnpm run build
        working-directory: site
        env:
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_UMAMI_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_URL }}

      # enablement creates the Pages site on first run rather than requiring it
      # to be switched on in repo settings first — without it the action fails
      # here with "Get Pages site failed" and nothing ever publishes.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
